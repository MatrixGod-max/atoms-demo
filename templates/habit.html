<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小坚持</title>
<style>
:root{--bg:#12131f;--card:#1c1e30;--ink:#eef0ff;--mut:#7d82a3;--acc:#6ee7b7;--line:#2a2d45}
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:22px}.date{color:var(--mut);font-size:13px;margin:4px 0 18px}
.list{display:flex;flex-direction:column;gap:10px}
.h{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px}
.h .dot{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--line);flex-shrink:0}
.h b{font-size:16px}.h small{display:block;color:var(--mut);margin-top:2px;font-size:12px}
.h .chk{margin-left:auto;width:46px;height:46px;border-radius:50%;border:2px solid var(--mut);background:none;color:transparent;font-size:20px;cursor:pointer;flex-shrink:0}
.h.done .chk{background:var(--acc);border-color:var(--acc);color:#0c281c}
.h.done b{text-decoration:line-through;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:48px 0;font-size:14px}
.addbar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.addbar form{display:flex;gap:8px}
.addbar input{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.addbar button{min-width:56px;border:none;border-radius:12px;background:var(--acc);color:#0c281c;font-size:22px;cursor:pointer}
.summary{margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--mut)}
.summary b{color:var(--acc)}
</style></head><body>
<h1>小坚持</h1><div class="date" id="today"></div>
<div class="summary" id="sum"></div>
<div class="list" id="list"></div>
<div class="empty" id="empty" hidden>还没有习惯。在底部输入一个想坚持的小事,比如「喝水 8 杯」。</div>
<div class="addbar"><form id="f"><input id="name" maxlength="12" placeholder="新习惯,如:早睡" required><button type="submit">＋</button></form></div>
<script>
(async function(){
var EMOJI=['🌅','📖','🏃','💧','🧘','✍️','🥗','😴'];
var habits=null;var todayKey=new Date().toISOString().slice(0,10);
document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
async function load(){try{if(window.quark&&window.quark.storage){habits=JSON.parse(await window.quark.storage.get('habits')||'null')}else{habits=JSON.parse(localStorage.getItem('hb')||'null')}}catch(_){habits=null}}
async function save(){try{if(window.quark&&window.quark.storage){await window.quark.storage.set('habits',JSON.stringify(habits))}else{localStorage.setItem('hb',JSON.stringify(habits))}}catch(_){}}
await load();
if(!habits)habits=[{n:'喝水 8 杯',e:'💧',days:[]},{n:'读书 20 分钟',e:'📖',days:[]}];
function streak(days){var s=0;var d=new Date();while(true){var k=d.toISOString().slice(0,10);if(days.indexOf(k)>=0){s++;d.setDate(d.getDate()-1)}else{if(k===todayKey){d.setDate(d.getDate()-1);continue}break}}return s}
function render(){
  var doneToday=habits.filter(function(h){return h.days.indexOf(todayKey)>=0}).length;
  document.getElementById('sum').innerHTML='今天完成 <b>'+doneToday+' / '+habits.length+'</b>'+(doneToday===habits.length&&habits.length?' · 全部达成,漂亮!🎉':'');
  document.getElementById('empty').hidden=habits.length>0;
  document.getElementById('list').innerHTML=habits.map(function(h,i){
    var done=h.days.indexOf(todayKey)>=0;
    return '<div class="h'+(done?' done':'')+'"><div class="dot">'+h.e+'</div><span><b>'+h.n+'</b><small>连续 '+streak(h.days)+' 天</small></span><button class="chk" data-i="'+i+'">✓</button></div>';
  }).join('');
}
document.getElementById('list').addEventListener('click',async function(e){
  var b=e.target.closest('.chk');if(!b)return;var h=habits[+b.dataset.i];
  var idx=h.days.indexOf(todayKey);if(idx>=0)h.days.splice(idx,1);else h.days.push(todayKey);
  await save();render();
});
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();var n=document.getElementById('name').value.trim();if(!n)return;
  habits.push({n:n,e:EMOJI[habits.length%EMOJI.length],days:[]});
  await save();this.reset();render();
});
await save();render();
})();
</script></body></html>
