<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>陈屿 — 产品设计师</title>
<style>
:root{--bg:#0f0f10;--ink:#f2f0ea;--mut:#8e8c85;--acc:#e8c469;--card:#17171a;--line:#26262b}
*{margin:0;box-sizing:border-box}body{font-family:Georgia,"PingFang SC",serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
header{padding:64px 0 40px}
h1{font-size:38px;font-weight:500}h1 em{color:var(--acc);font-style:normal}
.sub{color:var(--mut);margin-top:10px;max-width:480px}
.tabs{display:flex;gap:8px;padding:24px 0 16px;font-family:-apple-system,sans-serif}
.tabs button{background:none;border:1px solid var(--line);color:var(--mut);padding:7px 16px;border-radius:99px;cursor:pointer;font-size:13px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:40px}
.work{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;transition:transform .15s}
.work:hover{transform:translateY(-3px)}
.work .tag{font-size:11px;color:var(--acc);font-family:-apple-system,sans-serif;letter-spacing:1px}
.work h3{font-size:17px;margin:8px 0 6px;font-weight:500}
.work p{color:var(--mut);font-size:13.5px}
.about{border-top:1px solid var(--line);padding:36px 0;color:var(--mut)}
.about b{color:var(--ink)}
.links{display:flex;gap:14px;padding:8px 0 56px;font-family:-apple-system,sans-serif;font-size:14px}
.links a{color:var(--acc);text-decoration:none;border-bottom:1px dashed var(--acc)}
</style></head><body>
<div class="wrap">
  <header>
    <h1>陈屿<br><em>把复杂系统做得像家用电器一样简单</em></h1>
    <p class="sub">产品设计师 · 7 年 B 端经验。相信好设计是删出来的,不是加出来的。</p>
  </header>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">全部</button><button data-f="b">B 端系统</button><button data-f="brand">品牌</button><button data-f="side">副业实验</button>
  </div>
  <div class="grid" id="grid"></div>
  <section class="about">
    <p><b>关于我</b> — 先后在物流与金融科技公司负责核心工作台设计,主导过 3 次大型改版,把日均操作步数砍掉 40%。工具之外,我写一份关于「界面里的克制」的通讯,已连载 60 期。</p>
  </section>
  <div class="links">
    <a href="mailto:hi@example.com">邮件</a><a href="#">简历 PDF</a><a href="#">通讯档案</a>
  </div>
</div>
<script>
var works=[
 {f:'b',tag:'B 端 · 2026',t:'调度工作台重设计',d:'把 11 步派单流程压到 3 步,错误率下降 62%。'},
 {f:'b',tag:'B 端 · 2025',t:'风控规则编辑器',d:'让业务人员用自然语言拼装规则,替代 SQL 工单。'},
 {f:'brand',tag:'品牌 · 2025',t:'茶室「山夏」视觉',d:'从字体到器物贴纸的一整套小生意视觉系统。'},
 {f:'side',tag:'副业 · 2026',t:'Shelf — 书架扫描 App',d:'拍一张书架照片,自动生成可分享的书单。'},
 {f:'b',tag:'B 端 · 2024',t:'指标口径字典',d:'一个让「日活」只有一种算法的内部产品。'},
 {f:'side',tag:'副业 · 2024',t:'像素天气挂件',d:'被 2 万人放在手机桌面上的小玩具。'}
];
function render(f){
  document.getElementById('grid').innerHTML=works.filter(function(w){return f==='all'||w.f===f}).map(function(w){
    return '<div class="work"><div class="tag">'+w.tag+'</div><h3>'+w.t+'</h3><p>'+w.d+'</p></div>'}).join('');
}
document.getElementById('tabs').addEventListener('click',function(e){
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  e.target.classList.add('on');render(e.target.dataset.f);
});
render('all');
</script></body></html>
