name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      AGENT_MOCK: "1"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Unit & integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: E2E smoke (mock pipeline)
        run: |
          DATA_DIR="$RUNNER_TEMP/quark-ci" npm run start -- --port 3456 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3456/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3456 bash scripts/smoke.sh
