name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AGENT_MOCK: "1"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src
      - name: Unit & integration tests
        run: npm test
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Publish failure log for debugging
        if: failure()
        run: |
          tail -c 20000 build.log > /tmp/ci-fail.log 2>/dev/null || echo "no build.log" > /tmp/ci-fail.log
          git config user.name ci-bot && git config user.email ci@quark
          git checkout --orphan ci-debug
          git rm -rfq . 2>/dev/null || true
          cp /tmp/ci-fail.log fail.log
          git add fail.log && git commit -qm "ci failure log $GITHUB_RUN_ID"
          git push -f origin ci-debug
      - name: E2E smoke (mock pipeline)
        run: |
          DATA_DIR="$RUNNER_TEMP/quark-ci" node scripts/seed-templates.mjs --no-s3
          DATA_DIR="$RUNNER_TEMP/quark-ci" NATIVE_BUILD_MOCK=1 SPEECH_MOCK=1 CLOUD_MOCK=1 npm run start -- --port 3456 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3456/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3456 bash scripts/smoke.sh
